# Конфиг Railway: https://docs.railway.com/reference/config-as-code
# Явный start (дублирует Procfile) и healthcheck для публичного URL.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Сервис только MAX в Railway: переопредели Start Command в UI → python -m app.max_entrypoint
startCommand = "python -m app.main"
healthcheckPath = "/health"
healthcheckTimeout = 30

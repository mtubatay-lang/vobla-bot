# Конфиг Railway: https://docs.railway.com/reference/config-as-code
# Явный start (дублирует Procfile) и healthcheck для публичного URL.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Один репозиторий — два сервиса: имя сервиса MAX в Railway должно быть `vobla-max` (или поменяйте ветку ниже).
startCommand = "sh -c \"case $RAILWAY_SERVICE_NAME in vobla-max) exec python -m app.max_entrypoint;; *) exec python -m app.main;; esac\""
healthcheckPath = "/health"
healthcheckTimeout = 30

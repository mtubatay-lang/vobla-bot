# Конфиг Railway: https://docs.railway.com/reference/config-as-code
# Явный start (дублирует Procfile) и healthcheck для публичного URL.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Один репозиторий — три сервиса по имени Railway-сервиса:
#   vobla-max → MAX webhook (FastAPI), vobla-mcp → MCP-сервер рассылок, прочее → Telegram-бот.
startCommand = "sh -c \"case $RAILWAY_SERVICE_NAME in vobla-max) exec python -m app.max_entrypoint;; vobla-mcp) exec python -m app.mcp_entrypoint;; *) exec python -m app.main;; esac\""
healthcheckPath = "/health"
healthcheckTimeout = 30
